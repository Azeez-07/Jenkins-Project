
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Webhook Status</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            color: #24292f;
        }

        .status {
            margin: 25px 0;
            padding: 18px;
            border-radius: 8px;
            background: #fff3cd;
            color: #664d03;
            font-weight: bold;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        button {
            background: #0969da;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0550ae;
        }

        p {
            color: #444;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>GitHub Webhook Monitor</h1>

        <p>Repository Push Event Status</p>

        <div id="status" class="status">
            Waiting for webhook status...
        </div>

        <p><strong>Event:</strong> <span id="event">None</span></p>
        <p><strong>Branch:</strong> <span id="branch">-</span></p>
        <p><strong>Commit:</strong> <span id="commit">-</span></p>
        <p><strong>Delivery ID:</strong> <span id="delivery">-</span></p>

        <button onclick="checkWebhook()">Check Status</button>
    </div>

    <script>
        // Change this to your receiver's status endpoint.
        const STATUS_URL = "/webhook/status";

        async function checkWebhook() {
            const status = document.getElementById("status");

            status.className = "status";
            status.textContent = "Checking webhook status...";

            try {
                const response = await fetch(STATUS_URL, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                if (data.event !== "push") {
                    status.textContent =
                        "Receiver is reachable. No push event reported yet.";
                    return;
                }

                status.className = "status success";
                status.textContent =
                    "SUCCESS! GitHub push webhook received.";

                document.getElementById("event").textContent =
                    data.event || "-";

                document.getElementById("branch").textContent =
                    data.branch || "-";

                document.getElementById("commit").textContent =
                    data.commit || "-";

                document.getElementById("delivery").textContent =
                    data.delivery || "-";

            } catch (error) {
                status.className = "status error";
                status.textContent =
                    "Unable to get webhook status: " + error.message;
            }
        }
    </script>

</body>
</html>
