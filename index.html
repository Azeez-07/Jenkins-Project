<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Webhook Push Test</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; }
    main { border: 1px solid #8886; border-radius: 14px; padding: 24px; }
    .status { padding: 12px 14px; border-radius: 8px; background: #8882; }
    code { overflow-wrap: anywhere; }
    button { padding: 10px 14px; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>GitHub Push Webhook Test</h1>
  <p>This page displays a status message when the webhook receiver has processed a GitHub <code>push</code> event.</p>
  <div class="status" id="status" role="status">Waiting for a push event…</div>
  <p><strong>Last event:</strong> <span id="event">None received</span></p>
  <p><strong>Commit:</strong> <span id="commit">—</span></p>
  <p><strong>Branch:</strong> <span id="branch">—</span></p>
  <p><strong>Delivery:</strong> <span id="delivery">—</span></p>
  <button id="refresh">Check webhook status</button>
  <p><small>Configure <code>STATUS_URL</code> in this file to point to your webhook receiver's status endpoint.</small></p>
</main>
<script>
  // IMPORTANT:
  // A static HTML page cannot receive GitHub webhooks directly.
  // GitHub sends a POST request to a server-side webhook URL.
  // Set STATUS_URL to your receiver's status endpoint, which should return JSON:
  // { "event": "push", "branch": "main", "commit": "abc123", "delivery": "..." }
  const STATUS_URL = "/webhook/status";

  async function checkStatus() {
    const status = document.getElementById("status");
    status.textContent = "Checking webhook receiver…";
    try {
      const response = await fetch(STATUS_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (data.event !== "push") {
        status.textContent = "Receiver is reachable; no push event reported yet.";
        return;
      }
      status.textContent = "SUCCESS — push webhook received by the server.";
      document.getElementById("event").textContent = data.event || "—";
      document.getElementById("branch").textContent = data.branch || "—";
      document.getElementById("commit").textContent = data.commit || "—";
      document.getElementById("delivery").textContent = data.delivery || "—";
    } catch (error) {
      status.textContent = `Cannot read webhook status (${error.message}). Configure STATUS_URL and ensure the receiver is running.`;
    }
  }
  document.getElementById("refresh").addEventListener("click", checkStatus);
  checkStatus();
</script>
</body>
</html>
